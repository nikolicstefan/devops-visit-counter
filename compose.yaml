services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - 8000:8000

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

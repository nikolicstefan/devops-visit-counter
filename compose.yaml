services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-8000}

    env_file:
      - .env

    ports:
      - "${APP_PUBLIC_PORT:-8080}:${APP_PORT:-8000}"

    networks:
      - app-net

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/health')
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine3.23

    command: ["redis-server", "--appendonly", "yes"]

    networks:
      - app-net

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  app-net:

volumes:
  redis-data:
